version: '3.8'

services:
  # FastAPI Backend (localhost only - accessed via existing NGINX Proxy Manager)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: answerforge-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - APP_NAME=${APP_NAME:-AnswerForge}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://answerforge.edvistas.com,http://localhost}
    # Bind to localhost only - not exposed to the network
    # Your NGINX Proxy Manager should proxy to http://127.0.0.1:3030
    ports:
      - "127.0.0.1:3030:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Note: This setup assumes you have NGINX Proxy Manager (or similar) already installed
# on your proxy server. Configure your proxy to forward to:
#   http://127.0.0.1:3030
#
# The backend is bound to localhost (127.0.0.1) only and is NOT accessible from
# other machines on the network. Only your local proxy can reach it.
