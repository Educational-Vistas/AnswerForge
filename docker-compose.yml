version: '3.8'

services:
  # FastAPI Backend (runs inside Docker container)
  # Accessible on the host at localhost:3030 only
  # External access goes through NGINX Proxy Manager
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: answerforge-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - APP_NAME=${APP_NAME:-AnswerForge}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://answerforge.edvistas.com,http://localhost}
    # Port mapping: host localhost:3030 -> container internal:8000
    # Only accessible from the server running Docker
    ports:
      - "127.0.0.1:3030:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# NOTE: This backend runs inside a Docker container.
# It is NOT accessible from other servers directly.
#
# Access methods:
#   1. From the Docker host itself: curl http://localhost:3030/api/health
#   2. Through NGINX Proxy Manager: https://answerforge.edvistas.com/api/health
#
# If your proxy is on a different server, update the Forward IP to the Docker host's
# internal IP address in NGINX Proxy Manager.
