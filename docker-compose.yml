version: '3.8'

services:
  # FastAPI Backend (runs inside Docker container)
  # Accessible from any PC on the network via host port 3030
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: answerforge-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - APP_NAME=${APP_NAME:-AnswerForge}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://answerforge.edvistas.com,http://localhost}
    # Port mapping: host port 3030 -> container internal port 8000
    # Exposed to the network so you can access it from other PCs
    ports:
      - "3030:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# NOTE: This backend runs inside a Docker container on port 3030.
# It is accessible from any machine on the network.
#
# Access methods:
#   1. From the Docker host: curl http://localhost:3030/api/health
#   2. From other PCs: http://<server-ip>:3030/api/health
#   3. Through NGINX Proxy Manager: https://answerforge.edvistas.com/api/health
